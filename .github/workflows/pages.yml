name: Deploy Dashboard HTML (GitHub Pages)

on:
  workflow_run:
    workflows: ["Relatório Diário de Abertura"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Preparar site
        run: |
          mkdir -p _site
          if [ -f dashboard_cumulativo.html ]; then
            cp dashboard_cumulativo.html _site/index.html
            echo "dashboard_cumulativo.html copiado"
          else
            echo "<p>Dashboard ainda nao gerado. Execute o relatorio diario primeiro.</p>" > _site/index.html
            echo "Arquivo nao encontrado, pagina placeholder criada"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
