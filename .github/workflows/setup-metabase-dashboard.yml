name: Setup Metabase Dashboard (executar uma vez)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de criação (native = sem admin | csv-upload = com admin)"
        required: true
        default: "native"
        type: choice
        options:
          - native
          - csv-upload

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Diagnóstico do ambiente
        env:
          METABASE_API_KEY:  ${{ secrets.METABASE_API_KEY }}
          METABASE_BASE_URL: ${{ secrets.METABASE_BASE_URL }}
        run: |
          echo "=== Python ==="
          python --version
          python -c "import requests, csv, io, json, os, sys; print('imports ok')"
          echo "=== Arquivos ==="
          ls -la
          echo "=== Secrets presentes ==="
          [ -n "$METABASE_API_KEY"  ] && echo "METABASE_API_KEY:  SIM" || echo "METABASE_API_KEY:  NAO DEFINIDO"
          [ -n "$METABASE_BASE_URL" ] && echo "METABASE_BASE_URL: SIM" || echo "METABASE_BASE_URL: NAO DEFINIDO"

      - name: Criar dashboard (modo native)
        if: inputs.modo == 'native'
        env:
          METABASE_API_KEY:      ${{ secrets.METABASE_API_KEY }}
          METABASE_BASE_URL:     ${{ secrets.METABASE_BASE_URL }}
          METABASE_DASHBOARD_ID: ${{ secrets.METABASE_DASHBOARD_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u setup_metabase_dashboard.py --native

      - name: Criar dashboard (modo csv-upload)
        if: inputs.modo == 'csv-upload'
        env:
          METABASE_API_KEY:      ${{ secrets.METABASE_API_KEY }}
          METABASE_BASE_URL:     ${{ secrets.METABASE_BASE_URL }}
          METABASE_DASHBOARD_ID: ${{ secrets.METABASE_DASHBOARD_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u setup_metabase_dashboard.py
