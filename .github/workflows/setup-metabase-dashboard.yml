name: Setup Metabase Dashboard (executar uma vez)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Criar dashboard no Metabase
        env:
          METABASE_API_KEY:  ${{ secrets.METABASE_API_KEY }}
          METABASE_BASE_URL: ${{ secrets.METABASE_BASE_URL }}
          PAGES_URL:         ${{ secrets.PAGES_URL }}
          METABASE_TEXT_DASHBOARD_ID: ${{ secrets.METABASE_TEXT_DASHBOARD_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u setup_metabase_dashboard.py
